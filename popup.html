<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniUD Dark Theme</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 240px;
      background: #1e1e1e;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
    }

    .header {
      background: #161616;
      padding: 14px 16px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4e9de8;
      box-shadow: 0 0 6px rgba(78,157,232,0.6);
    }

    .header h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #f0f0f0;
    }

    .header p {
      font-size: 11px;
      color: #888;
      margin-top: 1px;
    }

    .body {
      padding: 14px 16px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .status-label {
      font-size: 13px;
      color: #bbb;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 42px;
      height: 22px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #3a3a3a;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #888;
      border-radius: 50%;
      transition: transform 0.2s, background 0.2s;
    }

    input:checked + .slider {
      background: rgba(78,157,232,0.25);
    }

    input:checked + .slider::before {
      transform: translateX(20px);
      background: #4e9de8;
    }

    .divider {
      border: none;
      border-top: 1px solid #2e2e2e;
      margin: 12px 0;
    }

    .info {
      font-size: 11px;
      color: #666;
      line-height: 1.5;
    }

    .info span {
      color: #4e9de8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="dot"></div>
    </div>
    <div>
      <h1>UniUD Dark Theme</h1>
      <p>elearning.uniud.it</p>
    </div>
  </div>

  <div class="body">
    <div class="status-row">
      <span class="status-label" id="status-label">Dark theme attivo</span>
      <label class="toggle">
        <input type="checkbox" id="toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <hr class="divider">

    <p class="info">
      Attivo su <span>elearning.uniud.it</span> e tutte le sottopagine del portale.
    </p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
